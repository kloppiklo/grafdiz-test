<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Граф. дизайн">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Результаты тестов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap admin" id="app"></main>

<script src="tests.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const CODE_KEY = "quiz_admin_code";
  const OPEN_TESTS = window.TESTS.filter(t => t.status === "open");
  const AVATAR = ["yellow", "pink", "lavender", "mint", "peach", "blue"];

  let code = "";
  try { code = sessionStorage.getItem(CODE_KEY) || ""; } catch (e) {}
  let testId = new URLSearchParams(location.search).get("t");
  if (!OPEN_TESTS.some(t => t.id === testId)) testId = OPEN_TESTS[0].id;
  let Q = null, data = null, open = null, sortBy = "date", confirmDel = null;
  const questionCache = {};

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = iso => new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const pillCls = p => p >= 0.8 ? "good" : p >= 0.5 ? "mid" : "bad";
  const meta = () => OPEN_TESTS.find(t => t.id === testId);
  const personKey = s => (s.last_name + " " + s.first_name).toLowerCase().replace(/\s+/g, " ").trim();

  function loadQuestions(id) {
    if (questionCache[id]) return Promise.resolve(questionCache[id]);
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "questions/" + id + ".js";
      s.onload = () => { questionCache[id] = window.QUIZ; resolve(window.QUIZ); };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function testSwitch() {
    return `<div class="chips" role="tablist">${OPEN_TESTS.map(t =>
      `<button type="button" class="chip ${t.id === testId ? "dark" : ""}" role="tab" aria-selected="${t.id === testId}" data-test="${t.id}">${esc(t.title)}</button>`).join("")}</div>`;
  }

  function login(errText) {
    app.innerHTML = `
      <div class="topbar"><a class="icon-btn" href="./" aria-label="На главную">←</a><span class="chip">Для преподавателя</span></div>
      <h1>Результаты <em>тестов</em></h1>
      <form class="card lavender login" id="login" novalidate>
        <label class="field" for="code">Код преподавателя
          <input type="password" id="code" autocomplete="current-password" required>
        </label>
        <p class="error" ${errText ? "" : "hidden"}>${esc(errText || "")}</p>
        <button class="btn block" type="submit">Открыть результаты <span class="arr">→</span></button>
      </form>`;
    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault();
      code = document.getElementById("code").value.trim();
      fetchData();
    });
  }

  async function fetchData(quiet) {
    try {
      const [questions, res] = await Promise.all([
        loadQuestions(testId),
        window.quizRpc("quiz_admin_results", { p_quiz: testId, p_code: code })
      ]);
      Q = questions; data = res;
      try { sessionStorage.setItem(CODE_KEY, code); } catch (e) {}
      render();
    } catch (e) {
      if (quiet === true) return;
      try { sessionStorage.removeItem(CODE_KEY); } catch (e2) {}
      login(e && (e.status === 400 || /code/i.test(e.message)) ? "Код не подошёл. Проверьте его и попробуйте ещё раз." : "Не удалось загрузить результаты. Проверьте интернет и попробуйте ещё раз.");
    }
  }

  function render() {
    const total = data.total || Q.questions.length;
    const all = data.attempts.slice();

    // номер попытки у каждого студента (по времени начала)
    const byPerson = {};
    all.slice().sort((a, b) => a.created_at.localeCompare(b.created_at)).forEach(s => {
      const k = personKey(s);
      (byPerson[k] = byPerson[k] || []).push(s);
      s.try = byPerson[k].length;
    });
    all.forEach(s => { s.tries = byPerson[personKey(s)].length; });

    // сводка — по последней завершённой попытке каждого студента
    const latestDone = Object.values(byPerson).map(list => list.filter(s => s.answered >= total).pop()).filter(Boolean);
    const students = Object.keys(byPerson).length;
    const inProgress = all.filter(s => s.answered < total).length;
    const avg = latestDone.length ? latestDone.reduce((x, s) => x + s.score, 0) / latestDone.length : 0;
    const share = students ? latestDone.length / students : 0;
    const C = 2 * Math.PI * 46;

    const subs = all.slice();
    if (sortBy === "name") subs.sort((a, b) => personKey(a).localeCompare(personKey(b), "ru") || a.try - b.try);
    else if (sortBy === "score") subs.sort((a, b) => b.score - a.score);
    else subs.sort((a, b) => (b.last_at || b.created_at).localeCompare(a.last_at || a.created_at));

    const rows = subs.map(s => {
      const isDone = s.answered >= total;
      const isOpen = open === s.id;
      const initials = (s.first_name[0] || "") + (s.last_name[0] || "");
      const color = AVATAR[[...personKey(s)].reduce((h, c) => h + c.charCodeAt(0), 0) % AVATAR.length];
      let detail = "";
      if (isOpen) {
        const items = Q.questions.map(q => {
          const a = s.answers[q.id];
          if (a === undefined) return `<div class="qitem"><span class="mk">·</span><span><b>${q.id}.</b> ${esc(q.text)}<br><span class="note">Ещё не ответил(а)</span></span></div>`;
          const ok = a === data.key[q.id];
          return `<div class="qitem ${ok ? "ok" : "no"}"><span class="mk">${ok ? "✓" : "✗"}</span>
            <span><b>${q.id}.</b> ${esc(q.text)}${ok ? "" : `<br><span class="note">Ответ: ${esc(q.options[a] || a)}<br>Верно: ${esc(q.options[data.key[q.id]])}</span>`}</span></div>`;
        }).join("");
        const del = confirmDel === s.id
          ? `<span class="note grow">Удалить эту попытку без возможности восстановить?</span>
             <button class="btn small" data-del-yes="${s.id}">Удалить</button>
             <button class="btn small ghost" data-del-no>Отмена</button>`
          : `<button class="btn small ghost" data-del="${s.id}">Удалить попытку</button>`;
        detail = `<div class="person-detail"><div class="qlist">${items}</div><div class="row">${del}</div></div>`;
      }
      return `<div class="person-card ${isOpen ? "open" : ""}">
        <button type="button" class="person" data-id="${s.id}" aria-expanded="${isOpen}">
          <span class="avatar" style="background: var(--${color})">${esc(initials.toUpperCase())}</span>
          <span class="who"><b>${esc(s.last_name)} ${esc(s.first_name)}</b>
            <span class="note">${s.tries > 1 ? "попытка " + s.try + " · " : ""}${isDone ? "готово" : "отвечает: " + s.answered + " из " + total} · ${fmt(s.last_at || s.created_at)}</span></span>
          <span class="pill ${isDone ? pillCls(s.score / total) : "wait"}">${s.score} / ${total}</span>
          <span class="chev" aria-hidden="true">${isOpen ? "⌃" : "›"}</span>
        </button>
        ${detail}
      </div>`;
    }).join("");

    const qstats = Q.questions.map(q => {
      const answered = latestDone.filter(s => s.answers[q.id] !== undefined);
      const ok = answered.filter(s => s.answers[q.id] === data.key[q.id]).length;
      const p = answered.length ? ok / answered.length : 0;
      return `<div class="qstat"><div class="num">${q.id}</div><div>${esc(q.text)}</div>
        <div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div><div class="num">${answered.length ? Math.round(p * 100) + "%" : "—"}</div></div>`;
    }).join("");

    app.innerHTML = `
      <div class="topbar">
        <a class="icon-btn" href="./" aria-label="На главную">←</a><span class="chip">Для преподавателя</span>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="refresh" aria-label="Обновить">↻</button>
      </div>
      <h1>Результаты <em>тестов</em></h1>
      ${testSwitch()}

      <section class="card lavender">
        <div class="result">
          <div>
            <p class="eyebrow">${esc(meta().module)}</p>
            <p class="score">${latestDone.length ? avg.toFixed(1) : "—"}<small> / ${total}</small></p>
            <p>средний балл</p>
          </div>
          <svg class="ring" viewBox="0 0 116 116" role="img" aria-label="Завершили ${Math.round(share * 100)}% студентов">
            <circle class="track" cx="58" cy="58" r="46"></circle>
            <circle class="val" cx="58" cy="58" r="46" stroke-dasharray="${C * share} ${C}"></circle>
            <text x="58" y="66" text-anchor="middle">${latestDone.length}/${students}</text>
          </svg>
        </div>
        <p class="note">Считается по последней завершённой попытке каждого студента. Обновляется само каждые 15 секунд.</p>
      </section>

      <div class="stats">
        <div class="stat"><span>Студентов</span><b>${students}</b></div>
        <div class="stat"><span>Отвечают сейчас</span><b>${inProgress}</b></div>
        <div class="stat"><span>Попыток всего</span><b>${all.length}</b></div>
      </div>

      <div class="row">
        <h2 class="grow">Студенты</h2>
        <div class="chips">
          <button type="button" class="chip ${sortBy === "date" ? "dark" : ""}" data-sort="date">по времени</button>
          <button type="button" class="chip ${sortBy === "name" ? "dark" : ""}" data-sort="name">по фамилии</button>
          <button type="button" class="chip ${sortBy === "score" ? "dark" : ""}" data-sort="score">по баллу</button>
        </div>
      </div>
      ${subs.length ? `<div class="people">${rows}</div>`
      : `<div class="card yellow"><h2>Пока никто не начал тест</h2><p>Отправьте студентам ссылку на главную страницу с тестами. Каждый ответ появляется здесь сразу, как только студент его отправил.</p></div>`}

      <h2>Какие вопросы даются сложнее</h2>
      <p class="muted">Доля верных ответов по последней завершённой попытке каждого студента.</p>
      <div class="qstats">${qstats}</div>`;

    app.querySelector("#refresh").addEventListener("click", () => fetchData());
    app.querySelectorAll("[data-test]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.test === testId) return;
      testId = b.dataset.test; open = null; confirmDel = null;
      history.replaceState(null, "", "?t=" + encodeURIComponent(testId));
      fetchData();
    }));
    app.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { sortBy = b.dataset.sort; render(); }));
    app.querySelectorAll("button.person").forEach(b => b.addEventListener("click", () => {
      const id = Number(b.dataset.id); open = open === id ? null : id; confirmDel = null; render();
    }));
    app.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { confirmDel = Number(b.dataset.del); render(); }));
    app.querySelectorAll("[data-del-no]").forEach(b => b.addEventListener("click", () => { confirmDel = null; render(); }));
    app.querySelectorAll("[data-del-yes]").forEach(b => b.addEventListener("click", async () => {
      try {
        await window.quizRpc("quiz_admin_delete", { p_quiz: testId, p_code: code, p_id: Number(b.dataset.delYes) });
        open = null; confirmDel = null; fetchData();
      } catch (e) { b.textContent = "Не удалось удалить"; }
    }));
  }

  setInterval(() => {
    if (data && code && confirmDel === null && document.visibilityState === "visible") fetchData(true);
  }, 15000);

  if (code) fetchData(); else login();
})();
</script>
</body>
</html>
