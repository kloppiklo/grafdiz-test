<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Граф. дизайн">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Тесты по графическому дизайну</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap" id="app"></main>

<script src="tests.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const who = window.Student.get();

  function status(t) {
    const st = read(window.quizStoreKey(t.id));
    const last = read("quiz_" + t.id + "_last");
    if (st && st.attempt && st.step !== "done") {
      const n = Object.keys(st.results || {}).length;
      return { pill: `<span class="pill wait">отвечено ${n} из ${t.count}</span>`, cta: "Продолжить" };
    }
    if (last) {
      const p = last.score / last.total;
      const cls = p >= 0.8 ? "good" : p >= 0.5 ? "mid" : "bad";
      return { pill: `<span class="pill ${cls}">последний результат ${last.score} / ${last.total}</span>`, cta: "Пройти ещё раз", again: true };
    }
    return { pill: `<span class="pill plain">${t.count} вопросов</span>`, cta: "Начать" };
  }

  const open = window.TESTS.filter(t => t.status === "open").map(t => {
    const s = status(t);
    return `<section class="card ${t.color} test-card">
      <div class="row"><span class="chip">${esc(t.module)}</span>${s.pill}</div>
      <h2>${esc(t.title)}</h2>
      ${t.topics ? `<div class="chips">${t.topics.map(x => `<span class="chip ghost">${esc(x)}</span>`).join("")}</div>` : ""}
      ${t.theory ? `<a class="btn ghost block" href="${esc(t.theory)}" target="_blank" rel="noopener">Теория: презентация</a>` : ""}
      <a class="btn block" href="test.html?t=${encodeURIComponent(t.id)}" data-id="${esc(t.id)}" ${s.again ? "data-again" : ""}>${s.cta} <span class="arr">→</span></a>
    </section>`;
  }).join("");

  const soon = window.TESTS.filter(t => t.status !== "open").map(t => `
    <div class="soon-row">
      <span class="dot-c" style="background: var(--${t.color})"></span>
      <div class="grow"><b>${esc(t.title)}</b><br><span class="note">${esc(t.module)}</span></div>
      <span class="pill plain">скоро</span>
    </div>`).join("");

  app.innerHTML = `
    <div class="topbar"><span class="chip">${who.first ? "Привет, " + esc(who.first) + "!" : "Курс графического дизайна"}</span></div>
    <h1>Тесты<br><em>по темам</em></h1>
    <p class="muted">Выберите тест. После каждого ответа сразу увидите, верно ли, а результат попадёт к преподавателю.</p>
    ${open}
    <h2 style="margin-top:8px">Дальше по курсу</h2>
    <div class="soon">${soon}</div>
    <a class="btn ghost block admin-link" href="admin.html">Вход для преподавателя</a>
  `;

  // «Пройти ещё раз» с главной: сбрасываем прошлое прохождение на этом устройстве
  app.querySelectorAll("[data-again]").forEach(a => a.addEventListener("click", () => {
    try { localStorage.removeItem(window.quizStoreKey(a.dataset.id)); } catch (e) {}
  }));
})();
</script>
</body>
</html>
