<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Граф. дизайн">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Тесты по графическому дизайну</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabbar" id="tabbar" hidden></nav>

<script src="tests.js"></script>
<script src="config.js"></script>
<script src="chat-kit.js"></script>
<script>
// Главная-приложение: при первом запуске — welcome и знакомство (имя хранится на телефоне),
// дальше — вкладки: главная, тесты, отработки, теория, прогресс, чат, профиль. Вкладка — в адресе (#theory и т. п.).
(function () {
  const app = document.getElementById("app");
  const bar = document.getElementById("tabbar");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const ONBOARDED = "quiz_onboarded";
  const OPEN = window.TESTS.filter(t => t.status === "open");
  const SOON = window.TESTS.filter(t => t.status !== "open");
  const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Android/Chrome отдают системное окно установки — сохраняем его до нажатия кнопки
  let installPrompt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; });

  const FLOWER = (() => {
    const pts = [];
    for (let i = 0; i < 160; i++) {
      const t = i / 160 * Math.PI * 2, r = 42 + 7 * Math.cos(10 * t);
      pts.push((50 + r * Math.cos(t)).toFixed(2) + " " + (50 + r * Math.sin(t)).toFixed(2));
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="var(--pink)" d="M' + pts.join(" L") + 'Z"/></svg>';
  })();

  const ICONS = {
    home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
    otr: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4M8.5 17h7"/>',
    tests: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
    theory: '<path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/>',
    progress: '<path d="M5 19V11M12 19V5M19 19v-6"/>',
    chat: '<path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
    profile: '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'
  };
  const TABS = [["home", "Главная"], ["tests", "Тесты"], ["otr", "Отработки"], ["theory", "Теория"], ["progress", "Прогресс"], ["chat", "Чат"], ["profile", "Профиль"]];
  // на телефоне «Профиль» в нижнем меню не помещается — он открывается по аватару на главной
  const WIDE_ONLY = ["profile"];

  // ---------- данные о прохождении (всё — на этом устройстве)
  function inProgress(t) {
    const st = read(window.quizStoreKey(t.id));
    return st && st.attempt && st.step !== "done" ? Object.keys(st.results || {}).length : null;
  }
  function best(t) { return read("quiz_" + t.id + "_best") || read("quiz_" + t.id + "_last"); }
  const pct = r => r.score / r.total;
  // если tests.js ещё старый из кэша — работаем без фото, а не падаем
  const Avatar = window.Avatar || { get: () => "", set: () => false, clear() {}, fromFile: () => Promise.reject(new Error("no avatar")) };
  // кружок профиля: фото, если оно есть, иначе первая буква имени
  const avaInner = who => { const ph = Avatar.get(); return ph ? `<img src="${ph}" alt="">` : esc((who.first || "?")[0].toUpperCase()); };
  const cls = r => pct(r) >= 0.8 ? "good" : pct(r) >= 0.5 ? "mid" : "bad";

  // ---------- welcome + знакомство
  let slide = 0;
  function welcome(fromProfile) {
    bar.hidden = true; document.body.classList.remove("has-tabs");
    const slides = [
      () => `
        <div class="hero-art" aria-hidden="true">
          <div class="shape flower">${FLOWER}</div><div class="shape square"></div><div class="shape circle"></div>
        </div>
        <h1>Графический<br><em>дизайн</em></h1>
        <p class="muted">Проверяйте себя после каждой темы курса: короткие тесты, теория и ваш прогресс — в одном приложении.</p>`,
      () => `
        <h1>Как это<br><em>работает</em></h1>
        <div class="stepcard"><span class="n" style="background:var(--yellow)">1</span><p>Выбираете ответ<small>10–12 вопросов, один верный вариант</small></p></div>
        <div class="stepcard"><span class="n" style="background:var(--pink)">2</span><p>Сразу видите, верно ли<small>и короткое пояснение к вопросу</small></p></div>
        <div class="stepcard"><span class="n" style="background:var(--blue)">3</span><p>Результат у преподавателя<small>можно пересдать, если хочется лучше</small></p></div>
        <div class="stepcard"><span class="n" style="background:var(--mint)">✦</span><p>Перед тестом — теория<small>презентация с занятия всегда под рукой</small></p></div>`,
      () => `
        <h1>Иконка<br><em>на экране</em></h1>
        <p class="muted">Добавьте приложение на экран «Домой» — и тесты будут в одно касание.</p>
        <div class="center"><img class="appicon" src="icons/icon-192.png" alt=""></div>
        ${installBlock()}`
    ];
    // шаг «установка» не нужен, если приложение уже стоит на экране
    const list = isStandalone() ? slides.slice(0, 2) : slides;
    if (slide >= list.length) return register(fromProfile);
    const last = slide === list.length - 1;
    app.innerHTML = `
      <div class="welcome">
        <div class="topbar between">${slide > 0 ? '<button class="icon-btn" id="back" aria-label="Назад">←</button>' : "<span></span>"}
          <button class="linkbtn" id="skip">Пропустить</button></div>
        ${list[slide]()}
        <div class="grow-sp"></div>
        <div class="dots">${list.map((_, i) => `<i class="${i === slide ? "on" : ""}"></i>`).join("")}</div>
        <button class="btn block" id="next">${last ? "Понятно" : "Дальше"} <span class="arr">→</span></button>
      </div>`;
    document.getElementById("next").onclick = () => { slide++; welcome(fromProfile); };
    document.getElementById("skip").onclick = () => { slide = list.length; welcome(fromProfile); };
    const back = document.getElementById("back");
    if (back) back.onclick = () => { slide--; welcome(fromProfile); };
    bindInstall();
    window.scrollTo(0, 0);
  }

  function installBlock() {
    if (isStandalone()) return `<p class="note">Приложение уже установлено на этом устройстве.</p>`;
    if (isIOS) return `
      <div class="ios">
        <div class="r"><span class="ic">⇪</span><span>Нажмите <b>«Поделиться»</b> в Safari</span></div>
        <div class="r"><span class="ic">＋</span><span>Выберите <b>«На экран „Домой“»</b></span></div>
        <div class="r"><span class="ic">✓</span><span>Нажмите <b>«Добавить»</b></span></div>
      </div>`;
    return `
      <button class="btn ghost block" id="install">Установить приложение</button>
      <p class="note" id="install-note">Если кнопка не сработала: меню браузера ⋮ → «Установить приложение» или «Добавить на главный экран».</p>`;
  }
  function bindInstall() {
    const b = document.getElementById("install");
    if (!b) return;
    b.onclick = async () => {
      if (!installPrompt) { document.getElementById("install-note").classList.add("strong"); return; }
      installPrompt.prompt();
      try { await installPrompt.userChoice; } catch (e) {}
      installPrompt = null;
    };
  }

  function register(fromProfile) {
    bar.hidden = true; document.body.classList.remove("has-tabs");
    const who = window.Student.get();
    app.innerHTML = `
      <div class="welcome">
        <div class="topbar">${fromProfile ? '<button class="icon-btn" id="cancel" aria-label="Назад">←</button>' : ""}</div>
        <h1>${fromProfile ? "Ваше<br><em>имя</em>" : "Давайте<br><em>знакомиться</em>"}</h1>
        <p class="muted">Так преподаватель увидит, чей это результат. Вводится один раз.</p>
        <form class="card pink" id="reg" novalidate>
          <label class="field" for="first">Имя<input type="text" id="first" autocomplete="given-name" maxlength="60" value="${esc(who.first)}"></label>
          <label class="field" for="last">Фамилия<input type="text" id="last" autocomplete="family-name" maxlength="60" value="${esc(who.last)}"></label>
          <p class="error" id="reg-err" hidden>Впишите имя и фамилию.</p>
          <button class="btn block" type="submit">${fromProfile ? "Сохранить" : "Начать"} <span class="arr">→</span></button>
        </form>
        <p class="note">Без пароля и почты. Имя можно поменять в профиле.</p>
      </div>`;
    const cancel = document.getElementById("cancel");
    if (cancel) cancel.onclick = () => show("profile");
    document.getElementById("reg").addEventListener("submit", e => {
      e.preventDefault();
      const first = document.getElementById("first").value.trim();
      const last = document.getElementById("last").value.trim();
      if (!first || !last) { document.getElementById("reg-err").hidden = false; return; }
      window.Student.set(first, last);
      write(ONBOARDED, true);
      if (Kit) Kit.refreshPush(savePush);
      show(fromProfile ? "profile" : "home");
    });
  }

  // ---------- вкладки
  function renderBar(active) {
    bar.hidden = false;
    bar.innerHTML = `<a class="tab-brand" href="#home"><img src="icons/icon-192.png" alt="">Граф.<em>дизайн</em></a>` + TABS.map(([id, label]) => `
      <a class="tab ${id === active ? "on" : ""} ${WIDE_ONLY.includes(id) ? "wide-only" : ""}" href="#${id}" ${id === active ? 'aria-current="page"' : ""}>
        <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id]}</svg></span>${label}</a>`).join("");
  }

  // карточка теста: результат, теория, тетрадь, начать/пересдать
  function testCard(t) {
    const r = best(t);
    const pill = r ? `<span class="pill ${cls(r)}">${r.score} / ${r.total}</span>` : `<span class="pill plain">${t.count} вопросов</span>`;
    return `
      <section class="mini" style="background:var(--${t.color})">
        <div class="top"><span class="pill plain">${esc(t.module)}</span>${pill}</div>
        <h3>${esc(t.title)}</h3>
        <div class="row">
          ${t.theory ? `<a class="btn ghost small" href="theory.html?t=${encodeURIComponent(t.id)}">Теория</a>` : ""}
          ${(t.extras || []).map(x => `<a class="btn ghost small" href="${esc(x.href)}" ${/\.pdf$/i.test(x.href) ? 'target="_blank" rel="noopener"' : ""}>${esc(x.short || "Тетрадь")}</a>`).join("")}
          <a class="btn small" href="test.html?t=${encodeURIComponent(t.id)}" data-id="${esc(t.id)}" ${r ? "data-again" : ""}>${r ? "Пересдать" : "Начать"} <span class="arr">→</span></a>
        </div>
      </section>`;
  }
  function contCardHtml(cont) {
    return `
      <section class="mini dark">
        <div class="top"><span class="pill ondark">Продолжить</span><span class="note ondark">${inProgress(cont)} из ${cont.count}</span></div>
        <h3>${esc(cont.title)}</h3>
        <div class="bar ondark"><i style="width:${Math.round(inProgress(cont) / cont.count * 100)}%;background:var(--${cont.color})"></i></div>
        <a class="btn block light" href="test.html?t=${encodeURIComponent(cont.id)}">Продолжить тест <span class="arr">→</span></a>
      </section>`;
  }
  // «Пересдать»: сбрасываем прошлое прохождение на этом устройстве
  function bindAgain() {
    app.querySelectorAll("[data-again]").forEach(a => a.addEventListener("click", () => {
      try { localStorage.removeItem(window.quizStoreKey(a.dataset.id)); } catch (e) {}
    }));
  }
  // 1 материал, 2 материала, 5 материалов
  const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return n + " " + (m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many); };
  const OTR_OPEN = () => (window.OTRABOTKI || []).filter(o => o.status === "open");
  // «сдано» — по сдачам с этого устройства
  const otrSent = o => new Set(window.OtrStore.get(o.id).map(x => x.task)).size;

  // ---------- назначенные отработки: пропущенные пары из журнала преподавателя (по имени и фамилии)
  let assignCache = null;
  async function loadAssignments() {
    const who = window.Student.get();
    try { assignCache = await window.quizRpc("student_assignments", { p_first_name: who.first, p_last_name: who.last }); }
    catch (e) { assignCache = assignCache || []; }
    return assignCache;
  }
  const otrMeta = id => (window.OTRABOTKI || []).find(o => o.id === id && o.status === "open");
  function assignHtml(list) {
    const open = (list || []).filter(a => !(a.otr_tasks.length && a.otr_tasks.every(t => a.task_status[t] === "ok")));
    if (!open.length) return "";
    const rows = open.map(a => {
      const date = a.lesson_date ? new Date(a.lesson_date + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "";
      const st = a.otr_tasks.map(t => a.task_status[t]);
      const label = st.some(x => x === "redo") ? "на доработку" : st.length && st.every(x => x) ? "на проверке" : st.some(x => x) ? "частично сдана" : "назначена";
      const m = otrMeta(a.otr_module);
      const task = a.otr_tasks.find(t => a.task_status[t] !== "ok");
      const href = m ? "otrabotka.html?m=" + encodeURIComponent(m.id) + (task ? "&p=" + encodeURIComponent(task) : "") : "";
      const inner = `<span class="sw" style="background:var(--white)">${String(a.pair).padStart(2, "0")}</span>
        <div class="grow">${esc(a.title)}<small>${date ? "пропуск " + date + " · " : ""}${m ? label : "материалы появятся позже — уточните у преподавателя"}</small></div>${m ? '<span class="go">›</span>' : ""}`;
      return m ? `<a class="li" href="${href}">${inner}</a>` : `<div class="li">${inner}</div>`;
    }).join("");
    return `<section class="card peach assign">
      <div class="row"><h2 class="grow">Вам назначена отработка</h2><span class="pill plain">${open.length}</span></div>
      <p class="note ink">Вы пропустили ${open.length === 1 ? "занятие" : "занятия"}. Разберите тему сами и сдайте практику — преподаватель проверит.</p>
      <div class="list">${rows}</div>
    </section>`;
  }
  function mountAssignments() {
    const box = document.getElementById("assign");
    if (!box) return;
    if (assignCache) box.innerHTML = assignHtml(assignCache);
    loadAssignments().then(list => { const b = document.getElementById("assign"); if (b) b.innerHTML = assignHtml(list); });
  }

  // ---------- главная: что делать дальше и сводка
  function homeTab() {
    const who = window.Student.get();
    const cont = OPEN.find(t => inProgress(t) !== null);
    const next = OPEN.find(t => !best(t) && t !== cont);
    const done = OPEN.filter(t => best(t));
    const avg = done.length ? Math.round(done.reduce((s, t) => s + pct(best(t)), 0) / done.length * 100) : null;
    const weak = done.filter(t => pct(best(t)) < 0.8).sort((a, b) => pct(best(a)) - pct(best(b)))[0];
    const otrs = OTR_OPEN();
    const otrDone = otrs.reduce((s, o) => s + otrSent(o), 0), otrAll = otrs.reduce((s, o) => s + o.pairs, 0);
    const materials = OPEN.filter(t => t.theory).length + OPEN.reduce((s, t) => s + (t.extras || []).length, 0);

    let step = "";
    if (cont) step = contCardHtml(cont);
    else if (next) step = `<div class="next-wrap"><p class="eyebrow">Следующий тест</p>${testCard(next)}</div>`;
    else if (weak) step = `<div class="next-wrap"><p class="eyebrow">Можно улучшить результат</p>${testCard(weak)}</div>`;
    else step = `<section class="card mint"><h2>Все открытые тесты пройдены</h2><p>Новые темы появятся по ходу курса. А пока можно заглянуть в теорию или отработки.</p></section>`;

    app.innerHTML = `
      <div class="hello"><div><p class="eyebrow">Привет,</p><h1 class="h-name">${esc(who.first)}!</h1></div>
        <a class="ava" href="#profile" aria-label="Профиль">${avaInner(who)}</a></div>
      <div id="assign"></div>
      <div class="cols">
        <div class="col">${step}</div>
        <div class="col">
          <a class="card lavender home-progress" href="#progress">
            <p class="eyebrow">Ваш прогресс</p>
            <p class="big-num">${done.length} <small>из ${OPEN.length} тестов</small></p>
            <div class="bar light"><i style="width:${OPEN.length ? Math.round(done.length / OPEN.length * 100) : 0}%"></i></div>
            <p class="note ink">${avg === null ? "Пройдите первый тест — здесь появится средний результат." : "Средний результат — " + avg + "%"}</p>
          </a>
        </div>
      </div>
      <div class="tiles">
        <a class="tile" href="#tests" style="background:var(--yellow)"><b>Тесты</b><span>${OPEN.length} открыто</span></a>
        <a class="tile" href="#otr" style="background:var(--pink)"><b>Отработки</b><span>${otrDone ? "сдано " + otrDone + " из " + otrAll : plural(otrs.length, "блок", "блока", "блоков")}</span></a>
        <a class="tile" href="#theory" style="background:var(--blue)"><b>Теория</b><span>${plural(materials, "материал", "материала", "материалов")}</span></a>
        <a class="tile" href="#chat" style="background:var(--mint)"><b>Чат</b><span>группа и объявления</span></a>
      </div>`;
    bindAgain();
    mountAssignments();
  }

  // ---------- все тесты
  function testsTab() {
    const cont = OPEN.find(t => inProgress(t) !== null);
    const cards = OPEN.filter(t => t !== cont).map(testCard).join("");
    const soon = SOON.map(t => `
      <div class="li soonrow"><span class="dot-c" style="background:var(--${t.color})"></span>
        <div class="grow">${esc(t.title)}<small>${esc(t.module)}</small></div><span class="pill plain">скоро</span></div>`).join("");
    app.innerHTML = `
      <h1>Тесты</h1>
      <p class="muted">После каждого ответа сразу видно, верно ли, а результат попадает к преподавателю. Пересдавать можно сколько угодно.</p>
      <div class="grid-cards">${cont ? contCardHtml(cont) : ""}${cards}</div>
      <h2 class="sub">Дальше по курсу</h2>
      <div class="list">${soon}</div>`;
    bindAgain();
  }

  // ---------- отработки пропущенных пар (otrabotka.html)
  function otrTab() {
    const rows = OTR_OPEN().map(o => {
      const sent = otrSent(o);
      return `
      <a class="li" href="otrabotka.html?m=${encodeURIComponent(o.id)}"><span class="sw" style="background:var(--${o.color})"></span>
        <div class="grow">${esc(o.title)}<small>${esc(o.module)} · ${sent ? "сдано " + sent + " из " + o.pairs : "конспект, примеры, практика"}</small></div><span class="go">›</span></a>`;
    }).join("");
    app.innerHTML = `
      <h1>Отработки</h1>
      <div id="assign"></div>
      <p class="muted">Пропустили пару или тема не далась? Разберите её сами: короткий конспект, примеры, самопроверка и практика. Работу сдаёте ссылкой — преподаватель проверит.</p>
      <div class="list">${rows || `<p class="note">Пока нет открытых отработок.</p>`}</div>`;
    mountAssignments();
  }

  function theoryTab() {
    const rows = window.TESTS.map(t => t.status === "open" && t.theory ? `
      <a class="li" href="theory.html?t=${encodeURIComponent(t.id)}"><span class="sw" style="background:var(--${t.color})"></span>
        <div class="grow">${esc(t.title)}<small>${esc(t.module)} · презентация</small></div><span class="go">›</span></a>` + (t.extras || []).map(x => `
      <a class="li" href="${esc(x.href)}" ${/\.pdf$/i.test(x.href) ? 'target="_blank" rel="noopener"' : ""}><span class="sw" style="background:var(--${t.color})">${/\.pdf$/i.test(x.href) ? "↓" : "✦"}</span>
        <div class="grow">${esc(x.title)}<small>${esc(t.module)} · ${esc(x.note)}</small></div><span class="go">${/\.pdf$/i.test(x.href) ? "↗" : "›"}</span></a>`).join("") : `
      <div class="li soonrow"><span class="sw" style="background:var(--${t.color})"></span>
        <div class="grow">${esc(t.title)}<small>${esc(t.module)} · скоро</small></div></div>`).join("");
    app.innerHTML = `
      <h1>Теория</h1>
      <p class="muted">Презентации и рабочие тетради с занятий. Слайды листаются свайпом, на телефоне удобнее смотреть горизонтально.</p>
      <div class="list">${rows}</div>`;
  }

  function progressTab() {
    const done = window.TESTS.filter(t => t.status === "open" && best(t));
    const total = window.TESTS.length;
    const avg = done.length ? Math.round(done.reduce((s, t) => s + pct(best(t)), 0) / done.length * 100) : null;
    const rows = window.TESTS.map(t => {
      const r = t.status === "open" ? best(t) : null;
      if (r) return `<div class="li"><span class="sw" style="background:var(--${t.color})">✓</span>
        <div class="grow">${esc(t.title)}<small>лучший результат</small></div><span class="pill ${cls(r)}">${r.score} / ${r.total}</span></div>`;
      if (t.status === "open") return `<a class="li" href="test.html?t=${encodeURIComponent(t.id)}"><span class="sw" style="background:var(--${t.color})"></span>
        <div class="grow">${esc(t.title)}<small>ещё не пройден</small></div><span class="go">›</span></a>`;
      return `<div class="li soonrow"><span class="sw" style="background:var(--cream)"></span>
        <div class="grow">${esc(t.title)}<small>скоро</small></div></div>`;
    }).join("");
    const weak = done.filter(t => pct(best(t)) < 0.8);
    const tip = weak.length ? `<p class="note">Совет: по теме «${esc(weak[0].title)}» меньше 80% — ${weak[0].theory ? `загляните в <a href="theory.html?t=${encodeURIComponent(weak[0].id)}">теорию</a> и` : ""} пересдайте.</p>` : "";
    app.innerHTML = `
      <h1>Прогресс</h1>
      <div class="cols"><div class="col">
      <section class="card lavender">
        <p class="eyebrow">Пройдено тем курса</p>
        <p class="big-num">${done.length} <small>из ${total}</small></p>
        <div class="bar light"><i style="width:${Math.round(done.length / total * 100)}%"></i></div>
        <p class="note ink">${avg === null ? "Пройдите первый тест — здесь появится средний результат." : "Средний результат — " + avg + "%"}</p>
      </section>
      ${tip}
      <p class="note">Прогресс хранится на этом устройстве. Все результаты видит преподаватель.</p>
      </div><div class="col"><div class="list">${rows}</div></div></div>`;
  }

  function profileTab() {
    const who = window.Student.get();
    const installRow = isStandalone() ? "" : `
      <button class="li" id="p-install"><span class="sw" style="background:var(--cream)">⇪</span>
        <div class="grow">Установить приложение<small>иконка на экране «Домой»</small></div><span class="go">›</span></button>`;
    app.innerHTML = `
      <h1>Профиль</h1>
      <section class="card pink profile-card">
        <label class="ava big ava-edit" for="p-file" title="Сменить фото">${avaInner(who)}<span class="ava-badge" aria-hidden="true">＋</span></label>
        <div class="grow"><h2>${esc(who.first)} ${esc(who.last)}</h2><p class="note ink">курс графического дизайна</p></div>
      </section>
      <input type="file" id="p-file" accept="image/*" hidden>
      <p class="error" id="p-photo-err" hidden>Не получилось открыть это фото. Попробуйте другое — JPG или PNG.</p>
      <div class="list">
        <label class="li" for="p-file"><span class="sw" style="background:var(--cream)">◐</span><div class="grow">${Avatar.get() ? "Сменить фото" : "Добавить фото"}<small>видно только на этом устройстве</small></div><span class="go">›</span></label>
        ${Avatar.get() ? `<button class="li" id="p-photo-del"><span class="sw" style="background:var(--cream)">✕</span><div class="grow">Убрать фото</div><span class="go">›</span></button>` : ""}
        <button class="li" id="p-name"><span class="sw" style="background:var(--cream)">✎</span><div class="grow">Изменить имя</div><span class="go">›</span></button>
        ${installRow}
        <button class="li" id="p-help"><span class="sw" style="background:var(--cream)">?</span>
          <div class="grow">Как это работает<small>показать знакомство ещё раз</small></div><span class="go">›</span></button>
      </div>
      <div id="p-logout-box">
        <button class="btn ghost block logout-btn" id="p-logout">Выйти из аккаунта</button>
      </div>
      <div class="grow-sp"></div>
      <a class="btn ghost block admin-link" href="admin.html">Вход для преподавателя</a>`;
    document.getElementById("p-name").onclick = () => register(true);
    document.getElementById("p-logout").onclick = () => {
      document.getElementById("p-logout-box").innerHTML = `
        <section class="card coral logout-confirm">
          <h2>Выйти из аккаунта?</h2>
          <p>С этого устройства сотрутся имя, фото, ваш прогресс по тестам и статусы отработок. Результаты, которые вы уже отправили, останутся у преподавателя.</p>
          <div class="row">
            <button class="btn grow" id="p-logout-yes">Выйти</button>
            <button class="btn ghost grow" id="p-logout-no">Отмена</button>
          </div>
        </section>`;
      document.getElementById("p-logout-yes").onclick = logout;
      document.getElementById("p-logout-no").onclick = () => profileTab();
    };
    document.getElementById("p-file").onchange = async e => {
      const err = document.getElementById("p-photo-err");
      try {
        const data = await Avatar.fromFile(e.target.files[0]);
        if (!Avatar.set(data)) throw new Error("storage");
        profileTab();
      } catch (ex) { err.hidden = false; }
    };
    const del = document.getElementById("p-photo-del");
    if (del) del.onclick = () => { Avatar.clear(); profileTab(); };
    document.getElementById("p-help").onclick = () => { slide = 0; welcome(true); };
    const pi = document.getElementById("p-install");
    if (pi) pi.onclick = () => { slide = 2; welcome(true); };
  }

  // Выход: стираем всё, что приложение хранит на устройстве о студенте (имя, фото, прогресс,
  // токены отработок и своих сообщений в чате), и показываем знакомство заново.
  function logout() {
    if (Kit) Kit.disablePush().catch(() => {});
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith("quiz_") || k.startsWith("otr_"))
        .forEach(k => localStorage.removeItem(k));
    } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
    slide = 0;
    welcome(false);
  }

  // ---------- чат группы: объявления преподавателя сверху, общая лента ниже.
  // Лента обновляется каждые 8 секунд, пока открыта вкладка. Свои сообщения можно удалить (ключ — на этом устройстве).
  // К сообщению можно прикрепить один файл или скриншот (кнопка-скрепка или вставка из буфера), уведомления — кнопкой над лентой.
  const MINE = "quiz_chat_mine";
  let chatTimer = null, chatData = null, chatFile = null;
  const Kit = window.ChatKit;
  const savePush = sub => { const w = window.Student.get(); return window.quizRpc("push_subscribe", { p_sub: sub, p_first_name: w.first, p_last_name: w.last }); };
  const sameName = (m, who) => !m.is_teacher && m.first_name.toLowerCase() === who.first.toLowerCase() && m.last_name.toLowerCase() === who.last.toLowerCase();
  const chatTime = iso => {
    const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
    return d.toLocaleString("ru-RU", today ? { hour: "2-digit", minute: "2-digit" } : { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  };
  const chatText = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  function chatTab() {
    app.innerHTML = `
      <h1>Чат <em>группы</em></h1>
      ${Kit ? `<div class="list push-row"><button type="button" class="li" id="push"></button></div>` : ""}
      <div id="news"></div>
      <div class="chat" id="feed"><p class="note">Загружаем сообщения…</p></div>
      <form class="composer" id="send" novalidate>
        <div class="att-pending" id="pending" hidden></div>
        <div class="composer-row">
          ${Kit ? `<label class="attach" for="file" aria-label="Прикрепить файл или скриншот" title="Прикрепить файл или скриншот">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></label>
          <input type="file" id="file" hidden>` : ""}
          <textarea id="msg" rows="1" maxlength="1000" placeholder="Сообщение для группы" aria-label="Сообщение"></textarea>
          <button class="send" type="submit" aria-label="Отправить">↑</button>
        </div>
      </form>
      <p class="error" id="chat-err" hidden></p>`;
    const form = document.getElementById("send"), ta = document.getElementById("msg"), err = document.getElementById("chat-err");
    chatFile = null;
    if (Kit) {
      Kit.pushButton(document.getElementById("push"), savePush);
      const pending = document.getElementById("pending"), input = document.getElementById("file");
      const pick = f => {
        chatFile = f || null; err.hidden = true;
        if (!chatFile) { pending.hidden = true; pending.innerHTML = ""; input.value = ""; return; }
        const thumb = /^image\//.test(f.type) ? `<img src="${URL.createObjectURL(f)}" alt="">` : `<span class="att-ext">${esc(((/\.(\w{1,5})$/.exec(f.name) || [])[1] || "файл").toUpperCase())}</span>`;
        pending.innerHTML = `${thumb}<span class="grow">${esc(f.name || "Скриншот")}</span><button type="button" class="icon-btn" id="unpick" aria-label="Убрать файл">✕</button>`;
        pending.hidden = false;
        document.getElementById("unpick").onclick = () => pick(null);
      };
      input.onchange = () => pick(input.files[0]);
      // скриншот из буфера обмена: Ctrl/Cmd+V в поле сообщения
      ta.addEventListener("paste", e => {
        const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === "file");
        if (!item) return;
        e.preventDefault();
        const f = item.getAsFile();
        pick(new File([f], f.name && f.name !== "image.png" ? f.name : "Скриншот.png", { type: f.type }));
      });
    }
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; };
    ta.addEventListener("input", grow);
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) { e.preventDefault(); form.requestSubmit(); } });
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const body = ta.value.trim();
      if (!body && !chatFile) return;
      const who = window.Student.get(), btn = form.querySelector(".send");
      btn.disabled = true; err.hidden = true;
      try {
        let file = null;
        if (chatFile) {
          btn.classList.add("busy");
          try { file = await Kit.upload(chatFile); } catch (ex) { ex.upload = true; throw ex; }
        }
        const r = await window.quizRpc("chat_send", { p_first_name: who.first, p_last_name: who.last, p_body: body, p_file: file });
        const mine = read(MINE) || {}; mine[r.id] = r.token; write(MINE, mine);
        ta.value = ""; grow();
        const un = document.getElementById("unpick"); if (un) un.click();
        await loadChat(true);
      } catch (ex) {
        err.textContent = ex.upload ? ex.message : /too fast/.test(ex.message) ? "Слишком много сообщений подряд — подождите минуту." : "Не получилось отправить. Проверьте интернет и попробуйте ещё раз.";
        err.hidden = false;
      }
      btn.classList.remove("busy");
      btn.disabled = false; ta.focus();
    });
    loadChat(true);
    chatTimer = setInterval(() => { if (document.visibilityState === "visible") loadChat(false); }, 8000);
  }

  async function loadChat(toBottom) {
    try { chatData = await window.quizRpc("chat_list", { p_after: 0 }); }
    catch (e) { if (!chatData) { const f = document.getElementById("feed"); if (f) f.innerHTML = `<p class="note">Не удалось загрузить чат. Проверьте интернет.</p>`; } return; }
    renderChat(toBottom);
  }

  function renderChat(toBottom) {
    const feed = document.getElementById("feed"), news = document.getElementById("news");
    if (!feed) return;
    const who = window.Student.get(), mine = read(MINE) || {};
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
    news.innerHTML = chatData.news.length ? `
      <section class="card yellow news"><p class="eyebrow ink">Объявления</p>
        ${chatData.news.slice(0, 3).map(n => `<div class="news-item">${n.body ? `<p>${chatText(n.body)}</p>` : ""}${Kit ? Kit.attachment(n) : ""}<span class="note">${chatTime(n.created_at)}</span></div>`).join("")}
      </section>` : "";
    let prevDay = "";
    feed.innerHTML = chatData.messages.length ? chatData.messages.map(m => {
      const me = sameName(m, who), day = new Date(m.created_at).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      const sep = day !== prevDay ? `<p class="chat-day">${day}</p>` : ""; prevDay = day;
      return `${sep}<div class="msg ${me ? "me" : ""} ${m.is_teacher ? "teacher" : ""}">
        ${me ? "" : `<b>${m.is_teacher ? "Преподаватель" : esc(m.first_name + " " + m.last_name)}</b>`}
        ${Kit ? Kit.attachment(m) : ""}${m.body ? `<p>${chatText(m.body)}</p>` : ""}
        <span class="note">${chatTime(m.created_at)}${mine[m.id] ? ` · <button type="button" class="linkbtn inline" data-del="${m.id}">удалить</button>` : ""}</span></div>`;
    }).join("") : `<div class="card mint"><h2>Здесь пока тихо</h2><p>Напишите первое сообщение: вопрос по заданию, полезная ссылка или просто «привет».</p></div>`;
    feed.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      const id = b.dataset.del, mine = read(MINE) || {};
      try { await window.quizRpc("chat_delete_own", { p_id: Number(id), p_token: mine[id] }); delete mine[id]; write(MINE, mine); loadChat(false); }
      catch (e) { b.textContent = "не удалось"; }
    }));
    if (toBottom || nearBottom) {
      const down = () => window.scrollTo(0, document.body.scrollHeight);
      down();
      // картинки догружаются позже и сдвигают ленту — докручиваем после каждой
      feed.querySelectorAll(".att-img img").forEach(img => { if (!img.complete) img.addEventListener("load", down, { once: true }); });
    }
  }

  const VIEWS = { home: homeTab, tests: testsTab, otr: otrTab, theory: theoryTab, progress: progressTab, chat: chatTab, profile: profileTab };
  function show(tab) {
    if (location.hash !== "#" + tab) { history.replaceState(null, "", "#" + tab); }
    route();
  }
  function route() {
    const who = window.Student.get();
    if (!read(ONBOARDED) || !who.first || !who.last) { slide = 0; return welcome(false); }
    const tab = (location.hash || "#home").slice(1);
    const view = VIEWS[tab] ? tab : "home";
    clearInterval(chatTimer); chatTimer = null;
    document.body.classList.add("has-tabs");
    renderBar(view);
    VIEWS[view]();
    if (view !== "chat") window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
