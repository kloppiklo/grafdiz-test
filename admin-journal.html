<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Журнал группы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap admin journal" id="app"></main>

<script src="tests.js"></script>
<script src="config.js"></script>
<script src="admin-nav.js"></script>
<script>
// Журнал преподавателя: успеваемость (тесты, теория, отработки, посещаемость) и журнал посещений.
// Журнал идёт по месяцам, по 4 занятия в месяц (можно добавить ещё). У занятия — дата, модуль и тема,
// их выбирает преподаватель. Отмеченный «не был» получает отработку по теме занятия; она закрывается,
// когда работу засчитывают в «Отработках».
// Ученики собираются автоматически по имени и фамилии; опечатки можно объединить, лишних — скрыть.
(function () {
  const app = document.getElementById("app");
  const CODE_KEY = "quiz_admin_code";
  const OPEN_TESTS = window.TESTS.filter(t => t.status === "open");
  const THEORY = OPEN_TESTS.filter(t => t.theory);
  const AVATAR = ["yellow", "pink", "lavender", "mint", "peach", "blue"];
  const VIEWS = [["perf", "Успеваемость"], ["journal", "Журнал"]];
  const MODULE_NAMES = ["Визуальное мышление", "Сетка, цвет, типографика", "Изображение, система, проект №1", "Illustrator и векторное мышление", "Плакат", "Айдентика и итоговый кейс"];
  const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

  let code = "";
  try { code = sessionStorage.getItem(CODE_KEY) || ""; } catch (e) {}
  let view = (location.hash || "#perf").slice(1);
  if (!VIEWS.some(v => v[0] === view)) view = "perf";
  let D = null, openStudent = null, mergeFor = null, renameFor = null, busy = false, flash = "";
  let jMonth = null;   // месяц, открытый в журнале (YYYY-MM-01)

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dShort = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace(".", "") : "";
  const dLong = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "long" }) : "";
  const pairNo = n => String(n).padStart(2, "0");
  const colorOf = key => AVATAR[[...key].reduce((h, c) => h + c.charCodeAt(0), 0) % AVATAR.length];
  const nameOf = s => s.first + " " + s.last;
  const pctCls = p => p >= 0.8 ? "good" : p >= 0.5 ? "mid" : "bad";

  // ---------- вход
  function login(errText) {
    app.innerHTML = `
      <div class="topbar"><span class="chip">Для преподавателя</span></div>
      <h1>Журнал <em>группы</em></h1>
      <form class="card lavender login" id="login" novalidate>
        <label class="field" for="code">Код преподавателя
          <input type="password" id="code" autocomplete="current-password" required>
        </label>
        <p class="error" ${errText ? "" : "hidden"}>${esc(errText || "")}</p>
        <button class="btn block" type="submit">Открыть журнал <span class="arr">→</span></button>
      </form>`;
    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault();
      code = document.getElementById("code").value.trim();
      load();
    });
  }

  async function load(quiet) {
    try {
      D = await window.quizRpc("journal_get", { p_code: code });
      try { sessionStorage.setItem(CODE_KEY, code); } catch (e) {}
      prepare();
      render();
    } catch (e) {
      if (quiet === true) return;
      try { sessionStorage.removeItem(CODE_KEY); } catch (e2) {}
      login(e && /code/i.test(e.message) ? "Код не подошёл. Проверьте его и попробуйте ещё раз." : "Не удалось загрузить журнал. Проверьте интернет и попробуйте ещё раз.");
    }
  }
  async function call(fn, args) {
    busy = true;
    try { await window.quizRpc(fn, Object.assign({ p_code: code }, args)); }
    catch (e) { flash = "Не получилось сохранить. Проверьте интернет и попробуйте ещё раз."; }
    busy = false;
    await load(true);
  }

  // ---------- сводим данные по ученикам
  let S = [];        // ученики с посчитанной успеваемостью
  let PAST = [];     // прошедшие занятия, у которых указан модуль
  function prepare() {
    const mk = {};
    D.marks.forEach(m => { (mk[m.key] = mk[m.key] || {})[m.session] = m.status; });
    PAST = D.sessions.filter(x => x.session_date && x.session_date <= D.today).sort((a, b) => a.session_date.localeCompare(b.session_date));
    S = D.students.map(s => {
      const k = s.key;
      // тесты: лучший завершённый результат и попытки
      const tests = {};
      D.tests.filter(t => t.key === k).forEach(t => {
        const cur = tests[t.quiz] || { best: null, tries: 0, open: 0 };
        if (t.answered >= t.total) { cur.tries++; if (!cur.best || t.score > cur.best.score) cur.best = t; }
        else cur.open = Math.max(cur.open, t.answered);
        tests[t.quiz] = cur;
      });
      const theory = {};
      D.theory.filter(t => t.key === k).forEach(t => { theory[t.theory] = t; });
      const marks = mk[k] || {};
      const subs = D.subs.filter(x => x.key === k);
      // отработки: занятия с темой, где ученик отмечен «не был»; статус — по сданным работам
      const assigned = D.sessions.filter(x => x.pair && marks[x.id] === "absent").map(x => {
        const l = lessonOf(x.pair);
        const st = l.otr_tasks.map(task => (subs.find(q => q.module === l.otr_module && q.task === task) || {}).status);
        let status = "todo";
        if (!l.otr_module) status = "none";
        else if (st.every(q => q === "ok")) status = "ok";
        else if (st.some(q => q === "redo")) status = "redo";
        else if (st.every(q => q)) status = "review";
        else if (st.some(q => q)) status = "part";
        return { session: x, lesson: l, status };
      });
      const present = PAST.filter(x => marks[x.id] === "present").length;
      const doneTests = OPEN_TESTS.filter(t => tests[t.id] && tests[t.id].best);
      const avg = doneTests.length ? doneTests.reduce((a, t) => a + tests[t.id].best.score / tests[t.id].best.total, 0) / doneTests.length : null;
      return Object.assign({}, s, { tests, theory, marks, assigned, present, avg, doneTests: doneTests.length });
    });
  }
  const OTR_ST = {
    todo: ["bad", "назначена"], part: ["mid", "частично сдана"], review: ["wait", "на проверке"],
    redo: ["bad", "на доработку"], ok: ["good", "зачтена"], none: ["plain", "нет материалов"]
  };
  const openOtr = s => s.assigned.filter(a => a.status !== "ok");
  const lessonOf = pair => D.lessons.find(l => l.pair === pair);
  // в каком модуле тема программы (номер модуля приходит из базы)
  const modOfPair = p => (lessonOf(p) || {}).module;
  const modLabel = n => n ? `Модуль ${n} · ${MODULE_NAMES[n - 1]}` : "модуль не указан";

  // ---------- общий каркас
  function render() {
    const ts = document.querySelector(".table-scroll"), keepX = ts ? ts.scrollLeft : 0, keepY = window.scrollY;
    app.innerHTML = `
      <div class="topbar">
        <span class="chip">Для преподавателя</span>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="refresh" aria-label="Обновить">↻</button>
      </div>
      <h1>${{ perf: "Успеваемость", journal: "Журнал" }[view]}</h1>
      ${flash ? `<p class="error">${esc(flash)}</p>` : ""}
      <div id="view"></div>`;
    flash = "";
    document.getElementById("refresh").onclick = () => load();
    ({ perf: renderPerf, journal: renderJournal })[view](document.getElementById("view"));
    const ts2 = document.querySelector(".table-scroll");
    if (ts2) ts2.scrollLeft = keepX;
    window.scrollTo(0, keepY);
  }
  window.addEventListener("hashchange", () => {
    const v = location.hash.slice(1);
    if (VIEWS.some(x => x[0] === v)) { view = v; openStudent = null; mergeFor = null; if (D) { render(); window.scrollTo(0, 0); } }
  });

  // ---------- успеваемость
  function renderPerf(el) {
    const n = S.length;
    const withAvg = S.filter(s => s.avg !== null);
    const avg = withAvg.length ? Math.round(withAvg.reduce((a, s) => a + s.avg, 0) / withAvg.length * 100) : null;
    const slots = n * PAST.length;
    const attPct = slots ? Math.round(S.reduce((a, s) => a + s.present, 0) / slots * 100) : null;
    const owe = S.reduce((a, s) => a + openOtr(s).length, 0);

    const head = OPEN_TESTS.map(t => `<th class="num" title="${esc(t.title)}"><span class="dot-h" style="background:var(--${t.color})"></span>${esc(t.title)}</th>`).join("");
    const rows = S.map(s => {
      const cells = OPEN_TESTS.map(t => {
        const r = s.tests[t.id];
        const th = s.theory[t.id] ? `<span class="th-mark" title="Теория открыта: ${s.theory[t.id].views} раз">◉</span>` : (t.theory ? `<span class="th-mark off" title="Теорию не открывал(а)">○</span>` : "");
        if (r && r.best) return `<td class="num">${th}<span class="pill ${pctCls(r.best.score / r.best.total)}">${r.best.score}/${r.best.total}</span></td>`;
        if (r && r.open) return `<td class="num">${th}<span class="pill wait">${r.open}/${t.count}…</span></td>`;
        return `<td class="num">${th}<span class="muted">—</span></td>`;
      }).join("");
      const ow = openOtr(s);
      return `<tr class="srow ${openStudent === s.key ? "on" : ""}" data-key="${esc(s.key)}">
        <td><span class="who"><span class="avatar sm" style="background:var(--${colorOf(s.key)})">${esc((s.first[0] || "") + (s.last[0] || "")).toUpperCase()}</span>${esc(s.last)} ${esc(s.first)}</span></td>
        ${cells}
        <td class="num">${PAST.length ? `${s.present}/${PAST.length}` : "—"}</td>
        <td class="num">${ow.length ? `<span class="pill bad">${ow.length}</span>` : (s.assigned.length ? `<span class="pill good">✓</span>` : `<span class="muted">—</span>`)}</td>
      </tr>`;
    }).join("");

    el.innerHTML = `
      <div class="tiles">
        <div class="tile" style="background:var(--mint)"><b>${n}</b><span>учеников</span></div>
        <div class="tile" style="background:var(--lavender)"><b>${avg === null ? "—" : avg + "%"}</b><span>средний результат тестов</span></div>
        <div class="tile" style="background:var(--yellow)"><b>${attPct === null ? "—" : attPct + "%"}</b><span>посещаемость</span></div>
        <div class="tile" style="background:var(--pink)"><b>${owe}</b><span>отработок не закрыто${S.reduce((a, s) => a + s.assigned.filter(x => x.status === "review" || x.status === "part").length, 0) ? " · есть на проверке" : ""}</span></div>
      </div>
      ${n ? `<div class="table-scroll"><table class="perf">
        <thead><tr><th>Ученик</th>${head}<th class="num">Был(а)</th><th class="num">Отработки</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <p class="note">Ячейка теста — лучший завершённый результат. ◉ — ученик открывал теорию к этому тесту, ○ — не открывал. «Был(а)» — на скольких прошедших занятиях ученик отмечен «был». Нажмите на ученика, чтобы увидеть подробности.</p>
        <div id="detail"></div>`
      : `<div class="card yellow"><h2>Пока нет учеников</h2><p>Ученики появятся здесь автоматически, когда пройдут тест, откроют теорию, сдадут отработку или напишут в чат.</p></div>`}`;
    el.querySelectorAll("tr.srow").forEach(tr => tr.addEventListener("click", () => {
      openStudent = openStudent === tr.dataset.key ? null : tr.dataset.key; mergeFor = null; render();
      const d = document.getElementById("detail"); if (d && openStudent) d.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    if (openStudent) renderDetail(document.getElementById("detail"));
  }

  function renderDetail(el) {
    const s = S.find(x => x.key === openStudent);
    if (!s || !el) return;
    const tests = OPEN_TESTS.map(t => {
      const r = s.tests[t.id], th = s.theory[t.id];
      return `<div class="li"><span class="sw" style="background:var(--${t.color})"></span>
        <div class="grow">${esc(t.title)}<small>${r && r.best ? `лучший результат, попыток: ${r.tries}` : r && r.open ? `начат, отвечено ${r.open}` : "не проходил(а)"}${t.theory ? ` · теория: ${th ? "открыта " + th.views + " раз" : "не открывал(а)"}` : ""}</small></div>
        ${r && r.best ? `<span class="pill ${pctCls(r.best.score / r.best.total)}">${r.best.score} / ${r.best.total}</span>` : ""}</div>`;
    }).join("");
    const otr = s.assigned.length ? s.assigned.map(a => `<div class="li"><span class="sw" style="background:var(--cream)">${pairNo(a.lesson.pair)}</span>
        <div class="grow">${esc(a.lesson.title)}<small>пропуск ${dLong(a.session.session_date)}${a.lesson.otr_module ? "" : " · материалов отработки пока нет"}</small></div>
        <span class="pill ${OTR_ST[a.status][0]}">${OTR_ST[a.status][1]}</span></div>`).join("")
      : `<p class="note">Пропусков нет — отработки не назначены.</p>`;
    const others = S.filter(x => x.key !== s.key);
    el.innerHTML = `
      <section class="card ${colorOf(s.key)} student-card">
        <div class="row"><h2 class="grow">${esc(nameOf(s))}</h2><button type="button" class="icon-btn" id="d-close" aria-label="Закрыть">✕</button></div>
        <p class="note ink">Посещено ${s.present} из ${PAST.length} прошедших занятий${s.avg !== null ? ` · средний результат тестов ${Math.round(s.avg * 100)}%` : ""}</p>
        <div class="cols">
          <div class="col"><h3>Тесты и теория</h3><div class="list">${tests}</div></div>
          <div class="col"><h3>Отработки</h3><div class="list">${otr}</div></div>
        </div>
        ${renameFor === s.key ? `
        <form class="row rename" id="rename" novalidate>
          <label class="field grow" for="rn-first">Имя<input type="text" id="rn-first" maxlength="60" value="${esc(s.first)}"></label>
          <label class="field grow" for="rn-last">Фамилия<input type="text" id="rn-last" maxlength="60" value="${esc(s.last)}"></label>
          <button type="submit" class="btn small">Сохранить</button>
          <button type="button" class="btn small ghost" id="rn-no">Отмена</button>
        </form>
        <p class="note ink">Новое имя увидите вы — в журнале, тестах и отработках. У ученика в приложении останется имя, которое он ввёл сам.</p>` : ""}
        <div class="row">
          ${mergeFor === s.key ? `
            <label class="field grow" for="merge-into">Это тот же ученик, что и…
              <select id="merge-into">${others.map(o => `<option value="${esc(o.key)}">${esc(o.last)} ${esc(o.first)}</option>`).join("")}</select></label>
            <button type="button" class="btn small" id="merge-yes">Объединить</button>
            <button type="button" class="btn small ghost" id="merge-no">Отмена</button>`
          : `<button type="button" class="btn small ghost" id="rename-open">Переименовать</button>
             <button type="button" class="btn small ghost" id="merge">Объединить с другим именем</button>
             <button type="button" class="btn small ghost" id="hide">Скрыть из журнала</button>`}
        </div>
        ${mergeFor === s.key ? `<p class="note ink">Все результаты и отметки «${esc(nameOf(s))}» перейдут к выбранному ученику. Пригодится, если имя написали по-разному.</p>` : ""}
      </section>`;
    el.querySelector("#d-close").onclick = () => { openStudent = null; renameFor = null; render(); };
    const ro = el.querySelector("#rename-open"); if (ro) ro.onclick = () => { renameFor = s.key; mergeFor = null; render(); };
    const rf = el.querySelector("#rename");
    if (rf) {
      el.querySelector("#rn-no").onclick = () => { renameFor = null; render(); };
      rf.addEventListener("submit", e => {
        e.preventDefault();
        const first = el.querySelector("#rn-first").value.trim(), last = el.querySelector("#rn-last").value.trim();
        if (!first || !last) { flash = "Впишите и имя, и фамилию."; render(); return; }
        renameFor = null;
        call("journal_rename", { p_key: s.key, p_first_name: first, p_last_name: last });
      });
    }
    const m = el.querySelector("#merge"); if (m) m.onclick = () => { mergeFor = s.key; renameFor = null; render(); };
    const mn = el.querySelector("#merge-no"); if (mn) mn.onclick = () => { mergeFor = null; render(); };
    const my = el.querySelector("#merge-yes"); if (my) my.onclick = () => {
      const into = el.querySelector("#merge-into").value; mergeFor = null; openStudent = into;
      call("journal_merge", { p_alias: s.key, p_canonical: into });
    };
    const h = el.querySelector("#hide"); if (h) h.onclick = () => { openStudent = null; call("journal_hide", { p_key: s.key, p_hidden: true }); };
  }

  // ---------- журнал: месяц → занятия (дата + модуль) → отметки учеников
  const ST = {
    present: ["was", "✓", "был(а)"],
    absent: ["miss", "Н", "не был(а) — назначена отработка по теме"],
    made_up: ["was", "✓", "был(а)"]
  };
  const NEXT = { undefined: "present", present: "absent", absent: null, made_up: "absent" };
  const monthKey = iso => iso.slice(0, 7) + "-01";
  function monthName(m) { const d = new Date(m + "T00:00:00"); const n = MONTHS[d.getMonth()]; return n[0].toUpperCase() + n.slice(1); }

  function renderJournal(el) {
    const months = [...new Set(D.sessions.map(x => x.month))].sort();
    if (!jMonth || !months.includes(jMonth)) jMonth = months.includes(monthKey(D.today)) ? monthKey(D.today) : months[months.length - 1];
    const sess = D.sessions.filter(x => x.month === jMonth).sort((a, b) => a.slot - b.slot);
    const chips = months.map(m => `<button type="button" class="chip ${m === jMonth ? "dark" : ""}" data-month="${m}">${monthName(m)}</button>`).join("");
    const modOpts = cur => `<option value="">модуль…</option>` + MODULE_NAMES.map((n, i) => `<option value="${i + 1}" ${cur === i + 1 ? "selected" : ""}>Модуль ${i + 1}</option>`).join("");
    const head = sess.map((x, i) => `<th class="lesson ${x.session_date && x.session_date > D.today ? "future" : ""} ${x.session_date ? "" : "nodate"}">
        <small>Занятие ${i + 1}</small>
        <input type="date" class="date-in sm" data-date="${x.id}" value="${x.session_date || ""}" aria-label="Дата занятия ${i + 1}">
        <select class="mod-in" data-mod-of="${x.id}" aria-label="Модуль занятия ${i + 1}" title="${x.module ? esc(modLabel(x.module)) : "Выберите модуль"}">${modOpts(x.module)}</select>
        <select class="mod-in topic-in" data-topic-of="${x.id}" aria-label="Тема занятия ${i + 1}" ${x.module ? "" : "disabled"} title="${x.pair ? esc(lessonOf(x.pair).title) : "Выберите тему"}">
          <option value="">${x.module ? "тема…" : "сначала модуль"}</option>
          ${D.lessons.filter(l => modOfPair(l.pair) === x.module).map(l => `<option value="${l.pair}" ${x.pair === l.pair ? "selected" : ""}>${pairNo(l.pair)} · ${esc(l.title)}</option>`).join("")}
        </select>
        ${x.slot > 4 ? `<button type="button" class="linkbtn small-all" data-del-session="${x.id}">убрать</button>` : ""}
      </th>`).join("");
    const rows = S.map(s => `<tr><td class="sticky"><span class="who"><span class="avatar sm" style="background:var(--${colorOf(s.key)})">${esc((s.first[0] || "") + (s.last[0] || "")).toUpperCase()}</span>${esc(s.last)} ${esc(s.first)}</span></td>
      ${sess.map(x => {
        if (!x.session_date) return `<td class="mark"><span class="att off" title="Сначала поставьте дату">·</span></td>`;
        const v = s.marks[x.id];
        const st = v ? ST[v] : ["none", "", "не отмечен"];
        return `<td class="mark"><button type="button" class="att ${st[0]}" data-s="${x.id}" data-key="${esc(s.key)}" title="${esc(st[2])}" aria-label="${esc(s.last + " " + s.first + ", " + (dShort(x.session_date)) + ": " + st[2])}">${st[1]}</button></td>`;
      }).join("")}</tr>`).join("");
    const totals = sess.map(x => `<td class="mark total">${x.session_date ? S.filter(s => s.marks[x.id] === "present").length : ""}</td>`).join("");
    const allBtns = sess.map(x => `<td class="mark">${x.session_date && S.length ? `<button type="button" class="linkbtn small-all" data-all="${x.id}">все были</button>` : ""}</td>`).join("");
    el.innerHTML = `
      <div class="chips mod-chips" role="tablist" aria-label="Месяц">${chips}</div>
      <p class="muted">Для каждого занятия поставьте дату, выберите модуль и тему. Потом нажимайте на клетки: <b>✓ был</b> → <b>Н не был</b> → пусто. Отмеченный «не был» получает отработку по теме занятия и видит её у себя на главной. Отработка закрывается, когда вы засчитываете сданную работу в «Отработках».</p>
      <div class="table-scroll"><table class="journal-table">
        <thead><tr><th class="sticky">${monthName(jMonth)}</th>${head}</tr></thead>
        ${S.length ? `<tbody>${rows}<tr><td class="sticky note">Присутствовали</td>${totals}</tr><tr><td class="sticky note">Отметить всех</td>${allBtns}</tr></tbody>` : ""}
      </table></div>
      ${S.length ? "" : `<p class="note">Учеников пока нет — они появятся автоматически, когда начнут проходить тесты или откроют теорию. Даты и модули можно поставить уже сейчас.</p>`}
      <div class="row">
        <button type="button" class="btn small ghost" id="add-session">+ Ещё занятие в ${monthName(jMonth).toLowerCase().replace(/ь$/, "е").replace(/й$/, "е")}</button>
        <span class="legend"><i class="att was">✓</i> был(а)</span><span class="legend"><i class="att miss">Н</i> не был(а) — отработка</span>
      </div>`;
    const sessOf = id => D.sessions.find(x => x.id === id);
    el.querySelectorAll("[data-month]").forEach(b => b.addEventListener("click", () => { jMonth = b.dataset.month; render(); }));
    el.querySelectorAll("input[data-date]").forEach(inp => inp.addEventListener("change", () => {
      const x = sessOf(Number(inp.dataset.date));
      call("journal_session_set", { p_id: x.id, p_date: inp.value || null, p_module: x.module, p_pair: x.pair });
    }));
    el.querySelectorAll("select[data-mod-of]").forEach(sel => sel.addEventListener("change", () => {
      const x = sessOf(Number(sel.dataset.modOf));
      const mod = sel.value ? Number(sel.value) : null;
      // при смене модуля тема из другого модуля сбрасывается
      call("journal_session_set", { p_id: x.id, p_date: x.session_date, p_module: mod, p_pair: x.pair && modOfPair(x.pair) === mod ? x.pair : null });
    }));
    el.querySelectorAll("select[data-topic-of]").forEach(sel => sel.addEventListener("change", () => {
      const x = sessOf(Number(sel.dataset.topicOf));
      call("journal_session_set", { p_id: x.id, p_date: x.session_date, p_module: x.module, p_pair: sel.value ? Number(sel.value) : null });
    }));
    el.querySelectorAll("[data-del-session]").forEach(b => b.addEventListener("click", () => call("journal_session_delete", { p_id: Number(b.dataset.delSession) })));
    el.querySelector("#add-session").onclick = () => call("journal_session_add", { p_month: jMonth });
    el.querySelectorAll("button.att").forEach(b => b.addEventListener("click", () => {
      if (busy) return;
      const sid = Number(b.dataset.s), key = b.dataset.key, s = S.find(x => x.key === key);
      const next = NEXT[s.marks[sid]];
      if (next) s.marks[sid] = next; else delete s.marks[sid];
      const st = next ? ST[next] : ["none", "", ""];
      b.className = "att " + st[0]; b.textContent = st[1];
      call("journal_mark", { p_session: sid, p_key: key, p_status: next });
    }));
    el.querySelectorAll("[data-all]").forEach(b => b.addEventListener("click", async () => {
      if (busy) return;
      const sid = Number(b.dataset.all);
      busy = true; b.textContent = "…";
      for (const s of S) if (s.marks[sid] !== "present") {
        try { await window.quizRpc("journal_mark", { p_code: code, p_session: sid, p_key: s.key, p_status: "present" }); } catch (e) { flash = "Часть отметок не сохранилась. Проверьте интернет."; }
      }
      busy = false; load(true);
    }));
  }

  setInterval(() => { if (D && code && !busy && view === "perf" && document.visibilityState === "visible") load(true); }, 30000);
  if (code) load(); else login();
})();
</script>
</body>
</html>
