<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Чат группы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
<main class="wrap admin" id="app"></main>

<script src="tests.js"></script>
<script src="config.js"></script>
<script src="chat-kit.js"></script>
<script src="admin-nav.js"></script>
<script>
// Чат группы для преподавателя: объявления и сообщения от имени преподавателя, удаление любых сообщений.
// Код преподавателя тот же, что в admin.html (хранится до закрытия вкладки).
(function () {
  const app = document.getElementById("app");
  const CODE_KEY = "quiz_admin_code";
  let code = "";
  try { code = sessionStorage.getItem(CODE_KEY) || ""; } catch (e) {}
  let data = null, kind = "news", confirmDel = null, draft = "", file = null;
  let mods = [], newMod = null, modOpen = false, modErr = "";
  const Kit = window.ChatKit;
  const savePush = sub => window.quizRpc("push_admin_subscribe", { p_code: code, p_sub: sub });

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = iso => new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const text = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

  function login(errText) {
    app.innerHTML = `
      <div class="topbar"><span class="chip">Для преподавателя</span></div>
      <h1>Чат <em>группы</em></h1>
      <form class="card lavender login" id="login" novalidate>
        <label class="field" for="code">Код преподавателя
          <input type="password" id="code" autocomplete="current-password" required>
        </label>
        <p class="error" ${errText ? "" : "hidden"}>${esc(errText || "")}</p>
        <button class="btn block" type="submit">Открыть чат <span class="arr">→</span></button>
      </form>`;
    document.getElementById("login").addEventListener("submit", e => {
      e.preventDefault();
      code = document.getElementById("code").value.trim();
      checkCode();
    });
  }

  // список чата открытый, поэтому код проверяем пустым удалением (несуществующий id)
  async function checkCode() {
    try {
      await window.quizRpc("chat_admin_delete", { p_code: code, p_id: 0 });
      try { sessionStorage.setItem(CODE_KEY, code); } catch (e) {}
      fetchData();
    } catch (e) {
      try { sessionStorage.removeItem(CODE_KEY); } catch (e2) {}
      login(/code/i.test(e.message) ? "Код не подошёл. Проверьте его и попробуйте ещё раз." : "Не удалось открыть чат. Проверьте интернет и попробуйте ещё раз.");
    }
  }

  async function fetchData() {
    try {
      [data, mods] = await Promise.all([window.quizRpc("chat_list", { p_after: 0 }), window.quizRpc("chat_admin_mod_list", { p_code: code })]);
      render();
    } catch (e) { if (!data) login("Не удалось загрузить чат. Проверьте интернет."); }
  }

  function delBtn(id) {
    return confirmDel === id
      ? `<span class="row"><button class="btn small" data-del-yes="${id}">Удалить</button><button class="btn small ghost" data-del-no>Отмена</button></span>`
      : `<button class="linkbtn inline" data-del="${id}">удалить</button>`;
  }

  // ---------- модераторы: ученик с личным кодом удаляет любые сообщения и объявления
  function modsHtml() {
    const names = [...new Set(data.messages.filter(m => !m.is_teacher).map(m => m.first_name + "|" + m.last_name))];
    const rows = mods.map(m => `
      <div class="mod-row"><span class="sw" style="background:var(--mint)">🛡</span>
        <span class="grow"><b>${esc(m.last_name)} ${esc(m.first_name)}</b><small class="note"> · с ${fmt(m.created_at).split(",")[0]}</small></span>
        <button class="btn small ghost" data-mod-del="${m.id}">Снять права</button></div>`).join("");
    return `
      <section class="card mint">
        <div class="row"><h2 class="grow">Модераторы чата</h2>${modOpen ? "" : `<button class="btn small" id="mod-open">Сделать модератором</button>`}</div>
        <p class="note ink">Модератор может удалять любые сообщения и объявления в чате, в том числе ваши. Код вводится в приложении: «Профиль» → «Код модератора чата».</p>
        ${newMod ? `<div class="card"><p>Код для <b>${esc(newMod.name)}</b>. Он показывается один раз — отправьте его ученику лично.</p>
          <p class="mod-code">${esc(newMod.code)}</p><button class="btn small ghost" id="mod-ok">Готово</button></div>` : ""}
        ${modOpen ? `<form id="mod-form" class="sub-form" novalidate>
          <div class="two">
            <input type="text" id="mod-first" placeholder="Имя" maxlength="60">
            <input type="text" id="mod-last" placeholder="Фамилия" maxlength="60">
          </div>
          ${names.length ? `<div class="chips">${names.map(n => { const [f, l] = n.split("|"); return `<button type="button" class="chip" data-pick-f="${esc(f)}" data-pick-l="${esc(l)}">${esc(l)} ${esc(f)}</button>`; }).join("")}</div>` : ""}
          <p class="error" ${modErr ? "" : "hidden"}>${esc(modErr)}</p>
          <div class="row"><button class="btn small" type="submit">Выдать код</button><button class="btn small ghost" type="button" id="mod-cancel">Отмена</button></div>
        </form>` : ""}
        ${rows ? `<div class="list">${rows}</div>` : (modOpen ? "" : `<p class="muted">Модераторов пока нет.</p>`)}
      </section>`;
  }

  function bindMods() {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    const keepDraft = () => { const ta = document.getElementById("body"); if (ta) draft = ta.value; };
    on("mod-open", () => { keepDraft(); modOpen = true; modErr = ""; render(); });
    on("mod-cancel", () => { keepDraft(); modOpen = false; render(); });
    on("mod-ok", () => { keepDraft(); newMod = null; render(); });
    app.querySelectorAll("[data-pick-f]").forEach(b => b.onclick = () => {
      document.getElementById("mod-first").value = b.dataset.pickF; document.getElementById("mod-last").value = b.dataset.pickL;
    });
    const form = document.getElementById("mod-form");
    if (form) form.addEventListener("submit", async e => {
      e.preventDefault(); keepDraft();
      const first = document.getElementById("mod-first").value.trim(), last = document.getElementById("mod-last").value.trim();
      if (!first || !last) { modErr = "Впишите имя и фамилию ученика."; return render(); }
      try {
        const r = await window.quizRpc("chat_admin_mod_add", { p_code: code, p_first_name: first, p_last_name: last });
        newMod = { name: first + " " + last, code: r.mod_code }; modOpen = false; modErr = "";
        fetchData();
      } catch (ex) { modErr = "Не получилось выдать код. Попробуйте ещё раз."; render(); }
    });
    app.querySelectorAll("[data-mod-del]").forEach(b => b.onclick = async () => {
      if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Точно снять?"; return; }
      keepDraft();
      try { await window.quizRpc("chat_admin_mod_remove", { p_code: code, p_id: Number(b.dataset.modDel) }); fetchData(); }
      catch (e) { b.textContent = "Не удалось"; }
    });
  }

  // скриншот из буфера обмена: Ctrl/Cmd+V в любом месте страницы
  document.addEventListener("paste", e => {
    const ta = document.getElementById("body");
    if (!ta || (e.target.tagName === "INPUT")) return;
    const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === "file");
    if (!item) return;
    e.preventDefault(); draft = ta.value;
    const f = item.getAsFile(); file = new File([f], "Скриншот.png", { type: f.type }); render();
  });

  function render() {
    const ta = document.getElementById("body");
    if (ta) draft = ta.value;
    const news = data.news.map(n => `
      <div class="news-item">${n.body ? `<p>${text(n.body)}</p>` : ""}${Kit.attachment(n)}<span class="note">${fmt(n.created_at)} · ${delBtn(n.id)}</span></div>`).join("");
    const msgs = data.messages.slice().reverse().map(m => `
      <div class="msg ${m.is_teacher ? "teacher" : ""}">
        <b>${m.is_teacher ? "Преподаватель" : esc(m.last_name + " " + m.first_name)}</b>
        ${Kit.attachment(m)}${m.body ? `<p>${text(m.body)}</p>` : ""}
        <span class="note">${fmt(m.created_at)} · ${delBtn(m.id)}</span></div>`).join("");
    app.innerHTML = `
      <div class="topbar">
        <span class="chip">Для преподавателя</span>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="refresh" aria-label="Обновить">↻</button>
      </div>
      <h1>Чат <em>группы</em></h1>
      <div class="list push-row"><button type="button" class="li" id="push"></button></div>
      <form class="card lavender" id="post" novalidate>
        <div class="chips">
          <button type="button" class="chip ${kind === "news" ? "dark" : ""}" data-kind="news">Объявление</button>
          <button type="button" class="chip ${kind === "msg" ? "dark" : ""}" data-kind="msg">Сообщение в чат</button>
        </div>
        <textarea id="body" maxlength="1000" placeholder="${kind === "news" ? "Например: в четверг пара в 214 аудитории" : "Сообщение от имени преподавателя"}. Скриншот — Ctrl+V">${esc(draft)}</textarea>
        <div class="att-pending" id="pending" ${file ? "" : "hidden"}>${file ? `<span class="grow">📎 ${esc(file.name || "Скриншот")}</span><button type="button" class="icon-btn" id="unpick" aria-label="Убрать файл">✕</button>` : ""}</div>
        <label class="btn small ghost" for="file">Прикрепить файл или скриншот</label>
        <input type="file" id="file" hidden>
        <p class="note ink">${kind === "news" ? "Объявление закрепится над чатом у всех студентов (показываются три последних)." : "Сообщение появится в общей ленте с подписью «Преподаватель»."}</p>
        <p class="error" id="post-err" hidden></p>
        <button class="btn block" type="submit">Опубликовать <span class="arr">→</span></button>
      </form>
      ${modsHtml()}
      <h2>Объявления</h2>
      ${news ? `<section class="card yellow news">${news}</section>` : `<p class="muted">Объявлений пока нет.</p>`}
      <h2>Сообщения <small class="note">новые сверху</small></h2>
      ${msgs ? `<div class="chat chat-admin">${msgs}</div>` : `<p class="muted">В чате пока никто не писал.</p>`}`;

    app.querySelector("#refresh").onclick = fetchData;
    Kit.pushButton(document.getElementById("push"), savePush);
    const keep = () => { draft = document.getElementById("body").value; };
    document.getElementById("file").onchange = e => { keep(); file = e.target.files[0] || null; render(); };
    const un = document.getElementById("unpick"); if (un) un.onclick = () => { keep(); file = null; render(); };
    bindMods();
    app.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { kind = b.dataset.kind; render(); });
    app.querySelector("#post").addEventListener("submit", async e => {
      e.preventDefault();
      const body = document.getElementById("body").value.trim();
      if (!body && !file) return;
      const btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      try {
        let up = null;
        if (file) { try { up = await Kit.upload(file); } catch (ex) { ex.upload = true; throw ex; } }
        await window.quizRpc("chat_admin_send", { p_code: code, p_kind: kind, p_body: body, p_file: up });
        document.getElementById("body").value = ""; draft = ""; file = null;
        fetchData();
      } catch (ex) {
        btn.disabled = false;
        const err = document.getElementById("post-err"); err.textContent = ex.upload ? ex.message : "Не получилось опубликовать. Попробуйте ещё раз."; err.hidden = false;
      }
    });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { confirmDel = Number(b.dataset.del); render(); });
    app.querySelectorAll("[data-del-no]").forEach(b => b.onclick = () => { confirmDel = null; render(); });
    app.querySelectorAll("[data-del-yes]").forEach(b => b.onclick = async () => {
      try { await window.quizRpc("chat_admin_delete", { p_code: code, p_id: Number(b.dataset.delYes) }); confirmDel = null; fetchData(); }
      catch (e) { b.textContent = "Не удалось"; }
    });
  }

  setInterval(() => {
    const ta = document.getElementById("body");
    if (data && code && confirmDel === null && !modOpen && !(ta && ta.value) && document.visibilityState === "visible") fetchData();
  }, 15000);

  if (code) checkCode(); else login();
})();
</script>
</body>
</html>
