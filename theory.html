<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Граф. дизайн">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Теория</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="theory-page">
<header class="theory-bar">
  <a class="icon-btn" href="./" aria-label="На главную">←</a>
  <span class="chip grow" id="title">Теория</span>
  <a class="btn small" id="totest" href="./">Пройти тест <span class="arr">→</span></a>
</header>
<iframe id="deck" title="Презентация" allowfullscreen></iframe>

<script src="tests.js"></script>
<script src="config.js"></script>
<script>
// Презентация с теорией к тесту: theory.html?t=color. Файл берётся из поля theory в tests.js,
// а верхняя полоска даёт вернуться на главную — в приложении на телефоне нет кнопки «назад».
(function () {
  const id = new URLSearchParams(location.search).get("t");
  const meta = window.TESTS.find(t => t.id === id && t.status === "open" && t.theory);
  if (!meta) { location.replace("./"); return; }
  // &d=<id> — дополнительная презентация темы из extras (kind: "deck")
  const d = new URLSearchParams(location.search).get("d");
  const extra = d && (meta.extras || []).find(x => x.kind === "deck" && x.id === d && x.src);
  const name = extra ? extra.title : meta.title;
  document.title = "Теория · " + name;
  document.getElementById("title").textContent = "Теория · " + name;
  document.getElementById("totest").href = "test.html?t=" + encodeURIComponent(meta.id);
  const deck = document.getElementById("deck");
  deck.src = extra ? extra.src : meta.theory;
  // отмечаем для журнала преподавателя, что ученик открыл теорию (раз в день на тему считается одна строка)
  const who = window.Student.get();
  if (who.first && who.last && window.quizRpc) window.quizRpc("theory_view", { p_first_name: who.first, p_last_name: who.last, p_theory: meta.id }).catch(() => {});
  deck.addEventListener("load", () => { try { deck.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
